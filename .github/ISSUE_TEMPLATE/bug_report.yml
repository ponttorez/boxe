name: Bug report
description: Report a bug in boxe

body:
  - type: markdown
    attributes:
      value: |
        - Write a descriptive issue title above, and open one issue for each bug.
        - Search [open](https://github.com/ponttorez/boxe/issues) and [closed](https://github.com/ponttorez/boxe/issues?q=is%3Aissue+is%3Aclosed) issues to check that it hasn't been reported yet.
        - If the bug also happens in stock Godot of the same version, please report it to the [Godot bug tracker](https://github.com/godotengine/godot/issues) instead.

  - type: input
    attributes:
      label: boxe version
      description: The Git commit hash of your build. It's shown at the bottom of the editor, and can be copied by clicking it.
      placeholder: 4.7.2.stable.custom_build [a1b2c3d4e]
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Reproducible in stock Godot
      description: Whether the bug also happens in the Godot version boxe is based on.
      options:
        - "No"
        - "Yes"
        - Not tested
    validations:
      required: true

  - type: input
    attributes:
      label: System information
      description: The OS, the GPU and the renderer. *Help > Copy System Info* in the editor copies them.
      placeholder: Fedora 44 - boxe v4.7.2 - Compatibility - Intel Iris Xe Graphics
    validations:
      required: true

  - type: textarea
    attributes:
      label: Issue description
      description: |
        What doesn't work, and what you expected instead.
        Add code and errors as text in <code>\`\`\`</code> blocks, and images or videos by drag and drop.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Steps to reproduce
      description: Steps or sample code that reproduce the issue. If you attach a project below, explain how to use it here.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Minimal reproduction project (MRP)
      description: |
        A small project that reproduces the issue, as a ZIP archive without the `.godot` folder. Drag and drop it here (10 MB at most).
        Write "N/A" if the bug happens in a new project too.
    validations:
      required: true
